name: Telegram CVE Notifier

on:
  schedule:
    # Runs at the start of every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows manual triggering of the workflow from the GitHub Actions tab

permissions:
  contents: write  # Required to commit state.json back to the repository

jobs:
  notify-cves:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Diagnostico CVE sin cache
        if: github.event_name == 'workflow_dispatch'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          MIN_SEVERITY: ${{ vars.MIN_SEVERITY || 'MEDIUM' }}
          REPORT_UNSCORED: ${{ vars.REPORT_UNSCORED || 'true' }}
        run: |
          python cve_notifier.py \
            --hours 48 \
            --state-file /tmp/cve-diagnostico.json \
            --dry-run
      - name: Test Telegram
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          import sys

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("ERROR: Faltan credenciales de Telegram")
              sys.exit(1)

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": "Prueba de notificacion CVE desde GitHub Actions"
              },
              timeout=20
          )

          data = response.json()
          print("HTTP Status:", response.status_code)
          print("Telegram OK:", data.get("ok"))
          print("Description:", data.get("description", ""))

          if not data.get("ok"):
              sys.exit(1)
          PY

      - name: Run CVE Notifier
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          MIN_SEVERITY: ${{ vars.MIN_SEVERITY || 'MEDIUM' }}
          REPORT_UNSCORED: ${{ vars.REPORT_UNSCORED || 'true' }}
        run: python cve_notifier.py

      - name: Commit and Push State Changes
        if: github.event_name == 'schedule'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Commit only if state.json has changed
          if git commit -m "Update NVD CVE last check timestamp [skip ci]"; then
            git push
          else
            echo "No state changes to commit."
          fi
