name: Diagnostico CVE (solo lectura)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Horas a revisar (0 = desde el timestamp de state.json)'
        required: true
        default: '2'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Analizar CVE sin enviar ni guardar
        env:
          HOURS: ${{ inputs.hours }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          MIN_SEVERITY: ${{ vars.MIN_SEVERITY || 'MEDIUM' }}
          REPORT_UNSCORED: ${{ vars.REPORT_UNSCORED || 'true' }}
        run: python diagnostico_cve.py --hours "$HOURS" --max-detalle 100
